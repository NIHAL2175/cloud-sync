.right{

.form-logo img{

object-fit:contain

.form-logo span{

.tabs{
display:flex;
gap:0;

border:1px solid var(--border);

}

.tab{

border:none;

font-family:'DM Sans',sans-serif;

.tab.active{
background:var(--blue);
color:#fff
}

.form-title{
font-family:'Outfit',sans-serif;
font-size:1.5rem;
font-weight:700;
margin-bottom:6px
}

.form-sub{
color:var(--muted);
font-size:.85rem;
margin-bottom:28px
}

.field{
margin-bottom:18px
}

.field label{
display:block;
font-size:.82rem;
font-weight:500;
margin-bottom:7px;
color:var(--muted)
}

.field input{
width:100%;
background:var(--card);
border:1px solid var(--border);
border-radius:9px;
padding:12px 16px;
color:var(--text);
font-family:'DM Sans',sans-serif;
font-size:.92rem;
outline:none
}

.field input:focus{
border-color:var(--blue)
}

.btn-submit{
width:100%;
background:linear-gradient(135deg, var(--blue), var(--blue2));
color:#fff;
border:none;
padding:13px;
border-radius:12px;
font-family:'Outfit',sans-serif;
font-size:.95rem;
font-weight:600;
cursor:pointer;
margin-top:6px;
box-shadow: 0 4px 15px rgba(37,99,235,0.25);

padding:12px 16px;

font-size:.84rem;
margin-bottom:16px;

}

.msg.error{
background:rgba(239,68,68,.1);
border:1px solid rgba(239,68,68,.3);
color:#fca5a5;
display:block
}

.msg.success{
background:rgba(34,197,94,.1);
border:1px solid rgba(34,197,94,.3);
color:#86efac;
display:block

@media(max-width:768px){

grid-template-columns:1fr

	<div style="display:flex;align-items:center;margin-bottom:18px;gap:14px;">

</div>

<div class="right">

<div class="form-box">

<img

<!-- LOGIN -->

/>

/>

	type="password"

</button>

</div>

</div>

<script>

// Password strength and criteria check
function checkPasswordStrength(password, elId) {
	const el = document.getElementById(elId);
	let strength = 0;
	if (password.length >= 8) strength++;
	if (/[A-Z]/.test(password)) strength++;
	if (/[a-z]/.test(password)) strength++;
	if (/[0-9]/.test(password)) strength++;
	if (/[^A-Za-z0-9]/.test(password)) strength++;
	let msg = '';
	let color = '';
	if (password.length === 0) {
		msg = '';
	} else if (strength <= 2) {
		msg = 'Weak'; color = '#ef4444';
	} else if (strength === 3 || strength === 4) {
		msg = 'Medium'; color = '#f59e42';
	} else if (strength === 5) {
		msg = 'Strong'; color = '#22c55e';
	}
	el.textContent = msg;
	el.style.color = color;
}

function passwordMeetsCriteria(password) {
	return password.length >= 8 &&
		/[A-Z]/.test(password) &&
		/[a-z]/.test(password) &&
		/[0-9]/.test(password) &&
		/[^A-Za-z0-9]/.test(password);
}

const API = "http://localhost:5000/api/auth";

function showMsg(text, type){

const el = document.getElementById("msg");

el.textContent = text;

el.className = "msg " + type;
}

function hideMsg(){

const el = document.getElementById("msg");

el.className = "msg";
}

function switchTab(tab){

document.getElementById("loginForm").style.display =
tab === "login" ? "block" : "none";

document.getElementById("signupForm").style.display =
tab === "signup" ? "block" : "none";

document.querySelectorAll(".tab").forEach(btn=>{

btn.classList.remove("active");
});

if(tab === "login"){

document.querySelectorAll(".tab")[0]
.classList.add("active");

}else{

document.querySelectorAll(".tab")[1]
.classList.add("active");
}

hideMsg();
}


// SIGNUP

async function signup(){


const name = document.getElementById("signupName").value.trim();
const email = document.getElementById("signupEmail").value.trim();
const password = document.getElementById("signupPass").value;

if(!name || !email || !password){
	return showMsg("Please fill all fields", "error");
}
if(!passwordMeetsCriteria(password)){
	return showMsg("Password must be at least 8 characters and include uppercase, lowercase, number, and special character.", "error");
}

try{

const res = await fetch(`${API}/register`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
email,
password
})

});

const data = await res.json();

if(res.ok){

showMsg(
"Account created successfully",
"success"
);

setTimeout(()=>{

switchTab("login");

},1500);

}else{

showMsg(data.message,"error");
}

}catch(err){

showMsg("Server error","error");
}
}


// LOGIN

async function login(){


const email = document.getElementById("loginEmail").value.trim();
const password = document.getElementById("loginPass").value;

if(!email || !password){
	return showMsg("Please enter email and password", "error");
}

try{

const res = await fetch(`${API}/login`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

});

const data = await res.json();

if(res.ok){

sessionStorage.setItem(
"token",
data.token
);

sessionStorage.setItem(
"userEmail",
email
);

showMsg(
"Login successful",
"success"
);

setTimeout(()=>{

window.location.href =
"dashboard.html";

},1000);

}else{

showMsg(data.message,"error");
}

}catch(err){

showMsg("Server error","error");
}
}


// AUTO REDIRECT

if(sessionStorage.getItem("token")){

window.location.href =
"dashboard.html";
}

</script>

<script src="cloudsync-bot.js"></script>
