<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View File - CloudSync</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M44 42H22c-5.523 0-10-4.477-10-10 0-5.185 3.947-9.449 8.998-9.95A11.99 11.99 0 0132 18c4.145 0 7.798 2.106 9.945 5.264A8.5 8.5 0 0144 23.5c4.694 0 8.5 3.806 8.5 8.5S48.694 42 44 42z' fill='url(%23g)' stroke='%2393c5fd' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css">
    <style>
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 30px;
            background: rgba(5, 8, 22, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to right,#3b82f6,#2563eb);
            color: white;
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn svg {
            width: 18px;
            height: 18px;
        }
        .back-btn:hover {
            transform: scale(1.05);
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40vw;
            margin: 0;
        }
        .download-btn {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .download-btn:hover {
            transform: scale(1.05);
            background: #15803d;
        }
        .viewer-container {
            margin-top: 80px; 
            width: 100vw;
            height: calc(100vh - 100px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
        }
        .file-preview {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            border: 2px solid #1e3a8a;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        /* Mobile Adjustments */
        @media(max-width: 768px) {
            .top-navbar {
                padding: 15px;
            }
            .title {
                display: none; /* Hide title on small screens to save space */
            }
            .viewer-container {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    
    <!-- Top sticky navbar for entire page visibility -->
    <div class="top-navbar">
        <a href="dashboard.html" class="back-btn">
            <!-- Perfectly aligned SVG Arrow -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </a>
        
        <h2 class="title" id="fileName">Loading File...</h2>
        
        <a id="downloadBtn" href="#" class="download-btn" download>Download File</a>
    </div>

    <!-- Viewer Space -->
    <div class="viewer-container">
        <iframe id="fileFrame" class="file-preview" src=""></iframe>
    </div>

    <script>
        // Extract URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const fileUrl = urlParams.get('file');
        const fileName = urlParams.get('name') || 'Shared File';

        if (fileUrl) {
            document.getElementById('fileFrame').src = fileUrl;
            document.getElementById('fileName').innerText = fileName;
            
            // Allow native downloading from the raw URL
            document.getElementById('downloadBtn').href = fileUrl;
        } else {
            document.getElementById('fileName').innerText = "Oops! No file found.";
            document.getElementById('fileFrame').style.display = "none";
            document.getElementById('downloadBtn').style.display = "none";
        }
    </script>
</body>
</html>
